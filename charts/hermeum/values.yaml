# ──────────────────────────────────────────────────────────────────────────────
# hermeum Helm chart values
#
# The dashboard is a Node/Express server that reconciles HermesAgent custom
# resources via the hermes-agent-operator. It exposes:
#   - :3000  HTTP   — UI, /auth, /trpc, /chat  (terminated by the ingress gateway)
#   - :8443  HTTPS — /webhook/mutating admission webhook (TLS terminated in-process)
#
# Required env vars are sourced from apps/dashboard/src/server/libs/config.ts.
# See that file for the authoritative list + semantics.
# ──────────────────────────────────────────────────────────────────────────────

# ── Dashboard container image ─────────────────────────────────────────────────
image:
  repository: ghcr.io/hermeum/dashboard
  # Tag defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
  # Optional image pull secret names (list of existing Secret names).
  pullSecrets: []

# ── Replica count ─────────────────────────────────────────────────────────────
# sqlite persistence is ReadWriteOnce, so replicas must be 1 when using the
# bundled sqlite + PVC path. Scale up only with an external (postgres) DB.
replicaCount: 1

# ── Operator dependency ───────────────────────────────────────────────────────
# The chart depends on hermes-agent-operator (OCI chart) which installs the
# HermesAgent CRD and the reconciler. Disable when the operator is already
# installed cluster-wide and this chart should only manage the dashboard.
operator:
  enabled: true
  # Values under this key are passed through to the hermes-agent-operator chart.
  # See its values.yaml for the available knobs.

# ── Dashboard env (HERMEUM_*, non-sensitive → ConfigMap) ─────────────────────
config:
  # Path to the agent templates config file (HERMEUM_AGENT_CONFIG_PATH).
  # The chart mounts the agentConfig ConfigMap at this path when non-empty.
  agentConfigPath: /app/agent-config.yaml
  # Path to the hermes-config docs directory (HERMEUM_HERMES_DOCS_PATH).
  # Shipped inside the image; override only if you mount custom docs.
  hermesDocsPath: /app/docs/hermes-config
  # Database backend dialect (HERMEUM_DATABASE_DIALECT): "sqlite" or "postgres".
  databaseDialect: sqlite
  # Kubernetes namespace where HermesAgent CRs are reconciled
  # (HERMEUM_KUBERNETES_NAMESPACE). Defaults to the release namespace.
  kubernetesNamespace: ""
  # Port the web server listens on (HERMEUM_PORT). The dashboard image
  # defaults to 3000; override only if you also change the Service port.
  port: 3000
  # Container image repository for the Hermes agent (HERMEUM_HERMES_IMAGE_REPOSITORY).
  hermesImageRepository: nousresearch/hermes-agent
  # Container image tag for the Hermes agent (HERMEUM_HERMES_IMAGE_TAG).
  hermesImageTag: v2026.7.7.2
  # OpenAI model id used by the AI config generator (HERMEUM_OPENAI_MODEL).
  openaiModel: gpt-5.5
  # Log verbosity level (HERMEUM_LOG_LEVEL): debug | info | warn | error.
  logLevel: info
  # Restrict sign-ups to this email domain (HERMEUM_ALLOWED_EMAIL_DOMAIN).
  allowedEmailDomain: ""

  # ── Web server TLS (optional, HERMEUM_TLS_CERT_FILE / HERMEUM_TLS_KEY_FILE) ─
  # When both certFile and keyFile are set, the dashboard serves the UI/trpc/
  # auth/chat endpoints over HTTPS on config.port instead of HTTP. This is an
  # alternative to the ingress gateway for TLS-terminating the web server
  # in-process. Leave both empty (default) to keep the web server on plain HTTP
  # and terminate TLS upstream via the ingress gateway.
  webTls:
    # Existing TLS Secret (kubernetes.io/tls type with tls.crt + tls.key).
    # Defaults to "<release>-web-tls". Only used when certFile + keyFile are set.
    secretName: ""
    # When both non-empty, the chart mounts the Secret and sets the env vars
    # that switch the dashboard to HTTPS.
    certFile: ""
    keyFile: ""

  # ── Per-agent ingress (HERMEUM_AGENT_INGRESS_*) ─────────────────────────────
  # These configure how the *operator* emits per-agent ingresses; they are
  # passed to the dashboard as env vars and surface in the UI. They do NOT
  # drive the dashboard's own ingress (see `ingress` below).
  agentIngress:
    # Public URL scheme advertised for agent ingresses (HERMEUM_AGENT_INGRESS_SCHEME).
    scheme: http
    # Base hostname for per-agent ingresses, "<agent-id>.<base>"
    # (HERMEUM_AGENT_INGRESS_BASE_HOSTNAME). When unset, no agent ingress is
    # generated by the operator.
    baseHostname: ""
    # Ingress controller class name set on generated agent ingresses
    # (HERMEUM_AGENT_INGRESS_CLASS_NAME). Omitted from the CR when unset.
    className: ""
    # TLS secret name for controller-terminated TLS on agent ingresses
    # (HERMEUM_AGENT_INGRESS_TLS_SECRET_NAME). When set, the operator emits a
    # tls block with this secret; when unset, no tls block is emitted.
    tlsSecretName: ""

# ── Sensitive env (HERMEUM_* + BETTER_AUTH_* + OPENAI_API_KEY → Secret) ──────
secrets:
  # REQUIRED when no existingSecret is set. Connection URL for the dashboard
  # database (HERMEUM_DATABASE_URL). For sqlite use "file:/var/lib/hermeum/db.sqlite".
  databaseUrl: ""
  # REQUIRED — session signing secret for Better Auth (BETTER_AUTH_SECRET).
  # Generate with: openssl rand -base64 32
  betterAuthSecret: ""
  # Optional — public base URL for Better Auth callbacks/redirects
  # (BETTER_AUTH_URL). Set to the dashboard's external URL when ingress is
  # enabled, e.g. "https://dash.example.com".
  betterAuthUrl: ""
  # Optional — SMTP server URL for outgoing email (HERMEUM_SMTP_URL).
  smtpUrl: ""
  # Optional — override the OpenAI API base URL (HERMEUM_OPENAI_BASE_URL).
  openaiBaseUrl: ""
  # Optional — API key for the AI config generator (mapped to OPENAI_API_KEY).
  openaiApiKey: ""
  # Use an existing Secret instead of templating one. When set, the chart
  # reads databaseUrl / betterAuthSecret / betterAuthUrl / smtpUrl /
  # openaiBaseUrl / openaiApiKey from the following keys: database-url,
  # better-auth-secret, better-auth-url, smtp-url, openai-base-url, openai-api-key.
  existingSecret: ""

# ── agentConfig override (ConfigMap mounted at config.agentConfigPath) ───────
# Full contents of agent-config.yaml. When empty, the image's bundled
# agent-config.example.yaml is used as-is.
#
# The mutating webhook for HermesAgent is driven by
# `agentTypes.<type>.mutatingWebhookJsonPatch` — populate this to apply
# JSON-Patch mutations to matching HermesAgent CRs on CREATE/UPDATE.
#
# Example:
#   agentConfig:
#     templates:
#       - id: minimal
#         name: Minimal
#         description: Create an agent with minimal configuration.
#         agentInput:
#           config:
#             model:
#               base_url: https://ollama.com/v1
#               default: kimi-k2.6
#               provider: ollama-cloud
#     agentTypes:
#       my-type:
#         description: An agent type that injects an annotation.
#         mutatingWebhookJsonPatch:
#           - op: add
#             path: /metadata/annotations/hermeum.app~1type
#             value: my-type
agentConfig: {}

# ── Mutating webhook for HermesAgent ──────────────────────────────────────────
# The dashboard serves POST /webhook/mutating on the HTTPS port below. The
# MutatingWebhookConfiguration admits CREATE/UPDATE on hermesagents and
# dispatches AdmissionReviews here; the dashboard returns the JSON-Patch from
# agentConfig.agentTypes[agent.type].mutatingWebhookJsonPatch.
#
# The dashboard starts its webhook HTTPS listener only when both
# HERMEUM_WEBHOOK_TLS_CERT_FILE and HERMEUM_WEBHOOK_TLS_KEY_FILE are set; the
# chart wires those from the TLS Secret below.
webhook:
  enabled: true
  # Container HTTPS port (HERMEUM_WEBHOOK_PORT). In-process TLS termination.
  port: 8443
  tls:
    # Use an operator-supplied TLS Secret instead of auto-provisioning.
    # When set, the Secret must contain tls.crt + tls.key + ca.crt; the chart
    # skips the cert-generation Job and mounts this Secret.
    existingSecret: ""
    # Filesystem paths the dashboard reads the cert/key from. These are passed
    # as HERMEUM_WEBHOOK_TLS_CERT_FILE / HERMEUM_WEBHOOK_TLS_KEY_FILE.
    certFile: /etc/hermeum/webhook-tls/tls.crt
    keyFile: /etc/hermeum/webhook-tls/tls.key
  # Admission review behaviour.
  failurePolicy: Ignore
  reapply: false
  matchPolicy: Equivalent
  # Scope which namespaces/hermesagents the webhook intercepts. Defaults match
  # the release namespace only; widen via labels as needed.
  namespaceSelector: {}
  objectSelector: {}
  rules:
    - operations: ["CREATE", "UPDATE"]
      apiGroups: ["agents.hermeum.app"]
      apiVersions: ["v1alpha1"]
      resources: ["hermesagents"]

# ── Ingress gateway (optional, dashboard UI only) ────────────────────────────
# Standard networking.k8s.io/Ingress for the dashboard UI (:3000). Controller
# selection is via ingress.className (nginx / istio-ingress / traefik / …).
# This is NOT used for the mutating webhook, which is served on the internal
# 8443 Service directly by the apiserver.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

# ── Database persistence (sqlite only) ───────────────────────────────────────
# A PVC mounted so the sqlite file survives pod restarts. Ignored when
# config.databaseDialect is "postgres".
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  mountPath: /var/lib/hermeum

# ── Migrations ────────────────────────────────────────────────────────────────
# The dashboard image ships drizzle-kit + per-dialect migration SQL. This
# chart runs `drizzle-kit migrate` as an initContainer before the server
# starts, so the schema is always current on boot. Disable if you run
# migrations out-of-band.
migrations:
  enabled: true

# ── Resources / pod defaults ─────────────────────────────────────────────────
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# ── Service account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""