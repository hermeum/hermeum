{{- $namespace := include "hermeum.namespace" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermeum.fullname" . }}
  labels:
    {{- include "hermeum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hermeum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermeum.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the agentConfig ConfigMap changes.
        {{- if include "hermeum.hasAgentConfig" . }}
        checksum/agent-config: {{ include "hermeum.agentConfigChecksum" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hermeum.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "hermeum.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command:
            - node
            - node_modules/drizzle-kit/bin.cjs
            - migrate
            - --config
            - {{ printf "drizzle.config.%s.ts" .Values.config.databaseDialect }}
          env:
            - name: HERMEUM_DATABASE_DIALECT
              value: {{ .Values.config.databaseDialect | quote }}
            - name: HERMEUM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermeum.secretName" . }}
                  key: database-url
            # drizzle-kit reads HERMEUM_DATABASE_URL from env (see drizzle.config.*.ts).
            - name: NODE_ENV
              value: production
          {{- if and (eq .Values.config.databaseDialect "sqlite") .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "hermeum.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: https-webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          env:
            # ── Non-sensitive (ConfigMap) ──
            - name: HERMEUM_AGENT_CONFIG_PATH
              value: {{ .Values.config.agentConfigPath | quote }}
            - name: HERMEUM_HERMES_DOCS_PATH
              value: {{ .Values.config.hermesDocsPath | quote }}
            - name: HERMEUM_DATABASE_DIALECT
              value: {{ .Values.config.databaseDialect | quote }}
            - name: HERMEUM_KUBERNETES_NAMESPACE
              value: {{ $namespace | quote }}
            - name: HERMEUM_PORT
              value: {{ .Values.config.port | quote }}
            - name: HERMEUM_HERMES_IMAGE_REPOSITORY
              value: {{ .Values.config.hermesImageRepository | quote }}
            - name: HERMEUM_HERMES_IMAGE_TAG
              value: {{ .Values.config.hermesImageTag | quote }}
            - name: HERMEUM_OPENAI_MODEL
              value: {{ .Values.config.openaiModel | quote }}
            - name: HERMEUM_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.allowedEmailDomain }}
            - name: HERMEUM_ALLOWED_EMAIL_DOMAIN
              value: {{ .Values.config.allowedEmailDomain | quote }}
            {{- end }}
            {{- if .Values.config.agentIngress.scheme }}
            - name: HERMEUM_AGENT_INGRESS_SCHEME
              value: {{ .Values.config.agentIngress.scheme | quote }}
            {{- end }}
            {{- if .Values.config.agentIngress.baseHostname }}
            - name: HERMEUM_AGENT_INGRESS_BASE_HOSTNAME
              value: {{ .Values.config.agentIngress.baseHostname | quote }}
            {{- end }}
            {{- if .Values.config.agentIngress.className }}
            - name: HERMEUM_AGENT_INGRESS_CLASS_NAME
              value: {{ .Values.config.agentIngress.className | quote }}
            {{- end }}
            {{- if .Values.config.agentIngress.tlsSecretName }}
            - name: HERMEUM_AGENT_INGRESS_TLS_SECRET_NAME
              value: {{ .Values.config.agentIngress.tlsSecretName | quote }}
            {{- end }}
            # ── Sensitive (Secret) ──
            - name: HERMEUM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermeum.secretName" . }}
                  key: database-url
            {{- if .Values.secrets.smtpUrl }}
            - name: HERMEUM_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermeum.secretName" . }}
                  key: smtp-url
            {{- end }}
            {{- if .Values.secrets.openaiBaseUrl }}
            - name: HERMEUM_OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermeum.secretName" . }}
                  key: openai-base-url
            {{- end }}
            {{- if .Values.secrets.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermeum.secretName" . }}
                  key: openai-api-key
            {{- end }}
            # ── Web server TLS (optional, in-process HTTPS for the UI) ──
            {{- if and .Values.config.webTls.certFile .Values.config.webTls.keyFile }}
            - name: HERMEUM_TLS_CERT_FILE
              value: {{ .Values.config.webTls.certFile | quote }}
            - name: HERMEUM_TLS_KEY_FILE
              value: {{ .Values.config.webTls.keyFile | quote }}
            {{- end }}
            # ── Mutating webhook TLS (in-process HTTPS) ──
            {{- if .Values.webhook.enabled }}
            - name: HERMEUM_WEBHOOK_TLS_CERT_FILE
              value: {{ .Values.webhook.tls.certFile | quote }}
            - name: HERMEUM_WEBHOOK_TLS_KEY_FILE
              value: {{ .Values.webhook.tls.keyFile | quote }}
            - name: HERMEUM_WEBHOOK_PORT
              value: {{ .Values.webhook.port | quote }}
            {{- end }}
          # The dashboard image's HEALTHCHECK probes / over HTTP; when web TLS
          # is enabled the listener is HTTPS, so switch the probe scheme.
          {{- $webTls := and .Values.config.webTls.certFile .Values.config.webTls.keyFile }}
          livenessProbe:
            {{- if $webTls }}
            httpsGet:
              {{- else }}
            httpGet:
              {{- end }}
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            {{- if $webTls }}
            httpsGet:
              {{- else }}
            httpGet:
              {{- end }}
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # agentConfig override mounted at HERMEUM_AGENT_CONFIG_PATH.
            {{- if include "hermeum.hasAgentConfig" . }}
            - name: agent-config
              mountPath: {{ .Values.config.agentConfigPath | quote }}
              subPath: agent-config.yaml
              readOnly: true
            {{- end }}
            # Webhook TLS cert/key.
            {{- if .Values.webhook.enabled }}
            - name: webhook-tls
              mountPath: {{ dir .Values.webhook.tls.certFile | quote }}
              readOnly: true
            {{- end }}
            # Web server TLS cert/key (optional, in-process HTTPS for the UI).
            {{- if and .Values.config.webTls.certFile .Values.config.webTls.keyFile }}
            - name: web-tls
              mountPath: {{ dir .Values.config.webTls.certFile | quote }}
              readOnly: true
            {{- end }}
            # sqlite data dir (postgres ignores this — the mount is harmless
            # but we only wire it for sqlite for clarity).
            {{- if and (eq .Values.config.databaseDialect "sqlite") .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
      volumes:
        {{- if include "hermeum.hasAgentConfig" . }}
        - name: agent-config
          configMap:
            name: {{ include "hermeum.fullname" . }}-agentconfig
            items:
              - key: agent-config.yaml
                path: agent-config.yaml
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: webhook-tls
          secret:
            secretName: {{ include "hermeum.webhookTlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if and .Values.config.webTls.certFile .Values.config.webTls.keyFile }}
        - name: web-tls
          secret:
            secretName: {{ .Values.config.webTls.secretName | default (printf "%s-web-tls" (include "hermeum.fullname" .)) | quote }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if and (eq .Values.config.databaseDialect "sqlite") .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hermeum.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}