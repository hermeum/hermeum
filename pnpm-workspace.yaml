packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: false
strictPeerDependencies: false

# Required by the pnpm v10 deploy command (dockerfiles/Dockerfile.app), which
# only deploys workspaces with injected workspace deps. Dev installs keep
# plain symlinks thanks to dedupeInjectedDeps (the default).
injectWorkspacePackages: true

overrides:
  serialize-javascript@<7: ">=7.1.2"
  uuid@<11.1.1: ">=11.1.1"
  esbuild@<=0.24.2: ">=0.25.0"
  nodemailer@<9.1.0: ">=9.1.0"
  vitest@<4.1.11: ">=4.1.11"
  undici@>=7.0.0 <7.29.1: "7.29.1"
  undici@>=7.28.0 <7.29.1: "7.29.1"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": ">=1.14.5"
  ip-address@<=10.7.0: ">=10.7.1"
  brace-expansion@<1.1.21: "1.1.21"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12"
  http-cache-semantics@<=4.2.0: ">=4.3.0"
  compression@<1.8.2: "1.8.2"
  proxy-addr@>=1.1.0 <2.0.8: "2.0.8"
  tinypool@<2.1.2: "2.1.2"
  source-map-js@<1.2.2: "1.2.2"
  postcss-selector-parser@<7.1.6: "7.1.6"
  launch-editor@<=2.14.1: "2.14.2"
  follow-redirects@<1.16.1: "1.16.1"
  shell-quote@<1.11.0: "1.11.0"
  # Keep a single copy of the CodeMirror/Lezer core packages. The language
  # grammars (@codemirror/lang-yaml, @codemirror/lang-json) and the editor
  # stack resolve their transitive deps independently, and duplicate copies
  # break highlighting: split @lezer/common gives @lezer/highlight's
  # style-tag NodeProp and @codemirror/language's language-data NodeProp
  # colliding ids, and split @codemirror/language/@codemirror/state make
  # their facets invisible to each other (syntaxTree returns an empty tree).
  "@codemirror/language": "6.13.1"
  "@codemirror/state": "6.7.6"
  "@lezer/common": "1.5.3"
  "@lezer/highlight": "1.2.5"
  "@lezer/lr": "1.4.11"

onlyBuiltDependencies:
  - core-js
  - esbuild
  - protobufjs
  - "@swc/core"
