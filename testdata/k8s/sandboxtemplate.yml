apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: kubebox-default-template
  namespace: default
spec:
  podTemplate:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: my-container
          image: busybox
          command: ["/bin/sh", "-c", "sleep 36000"]
          ports:
            - containerPort: 8888
              protocol: TCP
