name: Docker Publish

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.app
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            PLUGIN_REF=${{ github.sha }}
          tags: |
            ghcr.io/hermeum/hermeum:${{ github.ref_name }}
            ghcr.io/hermeum/hermeum:latest

      # Webhook cert-gen image (kubectl + openssl, baked at build time).
      # Keep the 1.36.5 tag in lockstep with the alpine/k8s base in
      # dockerfiles/Dockerfile.webhook-cert and the chart default in
      # charts/hermeum/values.yaml (webhook.certJob.image.tag).
      - name: Build and push webhook-cert image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.webhook-cert
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/hermeum/webhook-cert:1.36.5
            ghcr.io/hermeum/webhook-cert:latest