version: 2
updates:
  # Root workspace (pnpm)
  # typescript-eslint does not support TS 7.x yet (the native compiler rewrite);
  # eslint 10 also requires compatible tooling. Track these upgrades manually
  # until typescript-eslint ships TS 7 support
  # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # apps/app
  - package-ecosystem: npm
    directory: /apps/app
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # apps/docs
  - package-ecosystem: npm
    directory: /apps/docs
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/components
  - package-ecosystem: npm
    directory: /packages/components
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/eslint-config
  - package-ecosystem: npm
    directory: /packages/eslint-config
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/typescript-config
  - package-ecosystem: npm
    directory: /packages/typescript-config
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # Dockerfile.app
  - package-ecosystem: docker
    directory: /dockerfiles
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # Helm chart dependencies
  - package-ecosystem: helm
    directory: /charts/hermeum
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(chart)"
