version: 2
updates:
  # Root workspace (pnpm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # apps/app
  - package-ecosystem: npm
    directory: /apps/app
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # apps/docs
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/components
  - package-ecosystem: npm
    directory: /packages/components
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/eslint-config
  - package-ecosystem: npm
    directory: /packages/eslint-config
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # packages/typescript-config
  - package-ecosystem: npm
    directory: /packages/typescript-config
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # Dockerfile.app
  - package-ecosystem: docker
    directory: /dockerfiles
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      all-updates:
        update-types:
          - major
          - minor
          - patch

  # Helm chart dependencies
  - package-ecosystem: helm
    directory: /charts/hermeum
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(chart)"
