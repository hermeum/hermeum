name: hermeum
version: "0.1.0"
description: "Optional Hermeum plugin for Hermes — forwards agent-session events (LLM calls, tool usage, errors, subagent lifecycle) to the Hermeum control plane's trajectory store. Opt-in via `hermes plugins enable hermeum`."
author: Hermeum
requires_env:
  - HERMEUM_PLUGIN_BASE_URL
provides_hooks:
  - on_session_start
  - post_api_request
  - post_tool_call
  - api_request_error
  - on_session_finalize
  - subagent_start
  - subagent_stop