templates:
  - id: support-agent
    name: Support Agent
    description: Answers support questions using the docs and Notion knowledge base.
    agentInput:
      type: medium
      name: Support Agent
      description: Answers support questions using the docs and Notion knowledge base, and escalates to a human when the answer is missing, uncertain, or requires account-specific handling.
      soul: |-
        You are a helpful support agent grounded in the company's documentation and Notion knowledge base. Answer clearly and practically, cite or reference the source material when possible, and do not invent policies or product behavior.

        Escalate when the knowledge base does not contain enough information, the user reports a bug or outage, the issue involves billing/account/security/privacy, or the user needs a human decision. When escalating, summarize the user's question, relevant context, what you checked, and the next action needed.
      env:
        - name: NOTION_API_KEY
          value: ""
          sensitive: true
      skills:
        - skills/productivity/notion

agentTypes:
  medium:
    description: >-
      Medium resource profile — hermes container requests 2 CPU / 1Gi,
      limits 4 CPU / 2Gi. Applies proportional resources to the searxng and
      camofox sidecars when they are enabled (test-gated, first-match-wins).
    mutatingWebhookJsonPatch:
      # Both sidecars enabled.
      - - op: test
          path: /spec/searxng/enabled
          value: true
        - op: test
          path: /spec/camofox/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
        - op: add
          path: /spec/searxng/resources
          value:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - op: add
          path: /spec/camofox/resources
          value:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      # Searxng only.
      - - op: test
          path: /spec/searxng/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
        - op: add
          path: /spec/searxng/resources
          value:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      # Camofox only.
      - - op: test
          path: /spec/camofox/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
        - op: add
          path: /spec/camofox/resources
          value:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      # Neither sidecar enabled (unconditional fallback).
      - - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
  large:
    description: >-
      Large resource profile — hermes container requests 4 CPU / 2Gi,
      limits 8 CPU / 4Gi. Applies proportional resources to the searxng and
      camofox sidecars when they are enabled (test-gated, first-match-wins).
    mutatingWebhookJsonPatch:
      # Both sidecars enabled.
      - - op: test
          path: /spec/searxng/enabled
          value: true
        - op: test
          path: /spec/camofox/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "4"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 4Gi
        - op: add
          path: /spec/searxng/resources
          value:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
        - op: add
          path: /spec/camofox/resources
          value:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      # Searxng only.
      - - op: test
          path: /spec/searxng/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "4"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 4Gi
        - op: add
          path: /spec/searxng/resources
          value:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      # Camofox only.
      - - op: test
          path: /spec/camofox/enabled
          value: true
        - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "4"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 4Gi
        - op: add
          path: /spec/camofox/resources
          value:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      # Neither sidecar enabled (unconditional fallback).
      - - op: add
          path: /spec/hermes/resources
          value:
            requests:
              cpu: "4"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 4Gi